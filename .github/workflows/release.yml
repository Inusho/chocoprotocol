name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build standalone exe
        run: |
          npm install -g @yao-pkg/pkg
          pkg . --targets node20-win-x64 --output chocoprotocol.exe --compress GZip
        continue-on-error: true

      - name: Prepare release package
        shell: pwsh
        run: |
          # Release-Ordner erstellen
          New-Item -ItemType Directory -Path release/chocoprotocol -Force

          # Dateien kopieren
          Copy-Item bot.js, config.js, package.json, package-lock.json, start.bat, .env.example, README.md, LICENSE -Destination release/chocoprotocol/
          Copy-Item -Recurse commands release/chocoprotocol/
          Copy-Item -Recurse modules release/chocoprotocol/
          Copy-Item -Recurse dashboard release/chocoprotocol/

          # data + sounds Ordner mit READMEs
          New-Item -ItemType Directory -Path release/chocoprotocol/data -Force
          New-Item -ItemType Directory -Path release/chocoprotocol/sounds -Force
          Copy-Item data/README.txt release/chocoprotocol/data/
          Copy-Item sounds/README.txt release/chocoprotocol/sounds/

          # ZIP erstellen
          Compress-Archive -Path release/chocoprotocol -DestinationPath "chocoprotocol-${{ github.ref_name }}-windows.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "chocoprotocol ${{ github.ref_name }}"
          body: |
            ## Download & Start

            ### Windows (einfach)
            1. `chocoprotocol-${{ github.ref_name }}-windows.zip` herunterladen
            2. Entpacken
            3. `start.bat` doppelklicken
            4. Dashboard öffnet sich → Einstellungen konfigurieren → fertig!

            **Voraussetzung:** [Node.js](https://nodejs.org/) (LTS Version)

            ### Docker
            ```bash
            docker compose up -d
            ```

            ### Standalone (.exe)
            Falls vorhanden: `chocoprotocol.exe` herunterladen und starten.
            Benötigt KEINEN Node.js oder Docker.
          files: |
            chocoprotocol-${{ github.ref_name }}-windows.zip
            chocoprotocol.exe
          fail_on_unmatched_files: false
